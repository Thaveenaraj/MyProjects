apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: employee
  template:
    metadata:
      labels:
        app: employee
    spec:
      containers:
        - name: employee
          image: 383053847833.dkr.ecr.us-east-1.amazonaws.com/springboot-cassandra-demo:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql:aurora-postgres-cluster.cluster-c0ha4gkcibug.us-east-1.rds.amazonaws.com:5432/demo_db
            - name: SPRING_DATASOURCE_USERNAME
              value: auroradbadmin
            - name: SPRING_DATASOURCE_PASSWORD
              value: Password123!
---
apiVersion: v1
kind: Service
metadata:
  name: employee-svc
spec:
  type: NodePort
  selector:
    app: employee
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
